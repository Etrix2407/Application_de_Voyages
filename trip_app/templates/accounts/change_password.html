{% extends "base.html" %}

{% block title %}Changer mon mot de passe — Application de voyage{% endblock %}

{% block content %}
    <h1>Changer mon mot de passe</h1>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form }}
        <button type="submit">Enregistrer le mot de passe</button>
    </form>

    <p><a href="{% url 'profile' %}">Retour à mon profil</a></p>
{% endblock %}
