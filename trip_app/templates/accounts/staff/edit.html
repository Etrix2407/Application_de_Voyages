{% extends "base.html" %}

{% block title %}Modifier {{ member.get_full_name }}{% endblock %}

{% block content %}
    <h1>Modifier {{ member.get_full_name }}</h1>
    <p>Numéro d'employé : {{ member.employee_number }}</p>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form }}
        <button type="submit">Enregistrer</button>
    </form>

    <p><a href="{% url 'staff_list' %}">Retour au personnel</a></p>
{% endblock %}
