{% extends "base.html" %}

{% block title %}{{ title }} — Gestion du catalogue{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>

    {% include "_form_errors.html" %}
    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {{ form }}
        <button type="submit">Enregistrer</button>
    </form>

    <p><a href="{{ back_url }}">Annuler et revenir</a></p>
{% endblock %}
