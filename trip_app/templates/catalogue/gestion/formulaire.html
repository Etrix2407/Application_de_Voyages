{% extends "base.html" %}

{% block titre %}{{ titre }} — Gestion du catalogue{% endblock %}

{% block contenu %}
    <h1>{{ titre }}</h1>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form }}
        <button type="submit">Enregistrer</button>
    </form>

    <p><a href="{{ retour_url }}">Annuler et revenir</a></p>
{% endblock %}
