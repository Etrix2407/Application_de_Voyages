{% extends "base.html" %}

{% block titre %}Mot de passe oublié — Application de voyage{% endblock %}

{% block contenu %}
    <h1>Mot de passe oublié</h1>
    <p>Indiquez l'adresse e-mail de votre compte. Nous vous enverrons un lien pour choisir un nouveau mot de passe.</p>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form }}
        <button type="submit">Recevoir le lien</button>
    </form>
{% endblock %}
