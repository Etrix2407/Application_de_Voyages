{% extends "base.html" %}

{% block titre %}Se connecter — Application de voyage{% endblock %}

{% block contenu %}
    <h1>Se connecter</h1>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Se connecter</button>
    </form>

    <p><a href="{% url 'mot_de_passe_oublie' %}">Mot de passe oublié ?</a></p>
    <p>Pas encore de compte ? <a href="{% url 'inscription' %}">Créer un compte</a></p>
{% endblock %}
